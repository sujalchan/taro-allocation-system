<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Weekly Allocation</title>
</head>

<body>

    <h1>Add Weekly Allocation (JSON API)</h1>

    <div id="errorContainer" hidden>
        <strong>Unable to create allocation:</strong>

        <ul id="errorList"></ul>
    </div>

    <form id="allocationForm">

        <div>
            <label for="customerId">
                Customer
            </label>

            <select id="customerId" required>
                <option value="">
                    Select Customer
                </option>
            </select>
        </div>

        <br>

        <div>
            <label for="weekStart">
                Week
            </label>

            <input type="date" id="weekStart" required>

            <small>
                Any date in the week may be selected.
                It will be stored as the Monday of that week.
            </small>
        </div>

        <hr>

        <h2>Allocation Items</h2>

        <div id="allocationItems">

            <div class="allocation-item-row">

                <div>
                    <label>
                        Taro Type
                    </label>

                    <select class="taro-type-select" required>

                        <option value="">
                            Select Taro Type
                        </option>

                    </select>
                </div>

                <div>
                    <label>
                        Quantity
                    </label>

                    <input type="number" class="quantity-input" step="1" min="1" required>
                </div>

                <div>
                    <label>
                        Price per kg
                    </label>

                    <input type="number" class="price-input" step="0.01" min="0">

                    <small>
                        Leave blank to use the standard price.
                    </small>
                </div>

                <div>
                    <button type="button" class="remove-item-button">
                        Remove
                    </button>
                </div>

                <br>

            </div>

        </div>

        <button type="button" id="addItemButton">
            Add Another Taro Type
        </button>

        <br>
        <br>

        <button type="submit">
            Create Allocation
        </button>

        <a href="/allocations-client.html">
            Cancel
        </a>

    </form>

    <script src="/js/allocation-new-client.js"></script>

</body>

</html>
