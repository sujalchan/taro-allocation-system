openapi: 3.0.3

info:
  title: Customer Service API
  version: 1.0.0
  description: >
    REST API for managing customers in the Taro Allocation System.

servers:
  - url: http://localhost:8081
    description: Local development server

paths:
  /api/v1/customers:
    get:
      summary: Retrieve all customers
      operationId: getAllCustomers

      responses:
        "200":
          description: Customers retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerResponse"

    post:
      summary: Create a customer
      operationId: createCustomer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
            example:
              name: Island Foods
              contactName: John
              phone: "0211234567"
              active: true

      responses:
        "201":
          description: Customer created successfully
          headers:
            Location:
              description: URI of the newly created customer
              schema:
                type: string
                format: uri

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"

        "400":
          description: Invalid customer data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: VALIDATION_ERROR
                message: Customer name is required
                path: /api/v1/customers

  /api/v1/customers/{id}:
    get:
      summary: Retrieve a customer by ID
      operationId: getCustomerById

      parameters:
        - name: id
          in: path
          required: true
          description: Customer ID
          schema:
            type: integer
            format: int64
            example: 1

      responses:
        "200":
          description: Customer retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"

        "404":
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: CUSTOMER_NOT_FOUND
                message: Customer 999 does not exist
                path: /api/v1/customers/999

components:
  schemas:
    CustomerRequest:
      type: object

      required:
        - name

      properties:
        name:
          type: string
          example: Island Foods

        contactName:
          type: string
          example: John

        phone:
          type: string
          example: "0211234567"

        active:
          type: boolean
          default: true
          example: true

    CustomerResponse:
      type: object

      required:
        - id
        - name
        - active

      properties:
        id:
          type: integer
          format: int64
          example: 1

        name:
          type: string
          example: Island Foods

        contactName:
          type: string
          example: John

        phone:
          type: string
          example: "0211234567"

        active:
          type: boolean
          example: true

    ApiError:
      type: object

      required:
        - code
        - message
        - path

      properties:
        code:
          type: string
          example: CUSTOMER_NOT_FOUND

        message:
          type: string
          example: Customer 999 does not exist

        path:
          type: string
          example: /api/v1/customers/999
