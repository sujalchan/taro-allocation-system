<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Taro Types</title>
</head>

<body>

    <h1>Taro Types</h1>

    <p>
        <a href="/taro-types/new">
            Add Taro Type
        </a>
    </p>

    <p th:if="${#lists.isEmpty(taroTypes)}">
        No taro types found.
    </p>

    <table th:if="${!#lists.isEmpty(taroTypes)}" border="1">

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Standard Price</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="taroType : ${taroTypes}">

                <td th:text="${taroType.id}">
                    1
                </td>

                <td th:text="${taroType.name}">
                    Name
                </td>

                <td th:text="${taroType.description}">
                    Description
                </td>

                <td th:text="${'$' + #numbers.formatDecimal(taroType.standardPrice, 1, 2)}">
                    $0.00
                </td>

                <td>
                    <a th:href="@{/taro-types/{id}/edit(id=${taroType.id})}">
                        Edit
                    </a>
                </td>

            </tr>

        </tbody>

    </table>

    <p>
        <a href="/customers">
            Customers
        </a>
    </p>

    <p>
        <a href="/taro-types-client.html">
            Client-rendered taro types page
        </a>
    </p>

</body>

</html>
