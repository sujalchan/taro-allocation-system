<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Taro Type (JSON API)</title>
</head>

<body>
    <h1>Add Taro Type</h1>

    <div id="errorContainer" hidden>
        <strong>Unable to create taro type:</strong>
        <ul id="errorList">
        </ul>
    </div>

    <form id="taroTypeForm">
        <div>
            <label for="name">
                Name
            </label>
            <input type="text" id="name" name="name" required>
        </div>

        <br>
        <div>
            <label for="description">
                Description
            </label>
            <input type="text" id="description" name="description">
        </div>

        <br>
        <div>
            <label for="standardPrice">
                Standard Price
            </label>
            <input type="number" id="standardPrice" name="standardPrice" step="0.01" required>
        </div>

        <br>
        <button type="submit">
            Create Taro Type
        </button>

        <a href="/taro-types-client.html">
            Cancel
        </a>

    </form>

    <script src="js/taro-type-new-client.js"></script>
</body>

</html>
