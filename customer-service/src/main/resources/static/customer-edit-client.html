<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Customer</title>
</head>

<body>
    <h1>Edit Customer (JSON API)</h1>

    <div id="errorContainer" hidden>
        <strong>Unable to update customer:</strong>
        <ul id="errorList">
        </ul>
    </div>

    <form id="customerForm">
        <div>
            <label for="name">
                Business Name
            </label>
            <input type="text" id="name" name="name" required>
        </div>

        <br>
        <div>
            <label for="contactName">
                Contact Name
            </label>
            <input type="text" id="contactName" name="contactName">
        </div>

        <br>
        <div>
            <label for="phone">
                Phone
            </label>
            <input type="text" id="phone" name="phone">
        </div>

        <br>
        <div>
            <label for="active">
                Active
            </label>
            <input type="checkbox" id="active" name="active">
        </div>

        <br>
        <button type="submit">
            Update Customer
        </button>

        <a href="/customers-client.html">
            Cancel
        </a>
    </form>

    <script src="/js/customer-edit-client.js"></script>
</body>

</html>
