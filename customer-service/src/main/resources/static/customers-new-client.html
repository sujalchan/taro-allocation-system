<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Customer</title>
</head>

<body>

    <h1>Add Customer</h1>

    <div id="errorContainer" hidden>

        <strong>Unable to create customer:</strong>

        <ul id="errorList">
        </ul>

    </div>

    <form id="customerForm">

        <div>
            <label for="name">
                Business Name
            </label>

            <input type="text" id="name" name="name" required>
        </div>

        <br>

        <div>
            <label for="contactName">
                Contact Name
            </label>

            <input type="text" id="contactName" name="contactName">
        </div>

        <br>

        <div>
            <label for="phone">
                Phone
            </label>

            <input type="text" id="phone" name="phone">
        </div>

        <br>

        <div>
            <label for="active">
                Active
            </label>

            <input type="checkbox" id="active" name="active" checked>
        </div>

        <br>

        <button type="submit">
            Create Customer
        </button>

        <a href="/customers-client.html">
            Cancel
        </a>

    </form>

    <script>

        const form = document.getElementById("customerForm");

        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            clearErrors();

            const customer = {
                name: document.getElementById("name").value,
                contactName: document.getElementById("contactName").value,
                phone: document.getElementById("phone").value,
                active: document.getElementById("active").checked
            };

            try {

                const response = await fetch("/api/v1/customers", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(customer)
                });

                if (!response.ok) {

                    const error = await response.json();

                    showError(error.message);

                    return;
                }

                window.location.href = "/customers-client.html";

            } catch (error) {

                showError("Unable to communicate with the server.");
            }
        });

        function showError(message) {

            const errorContainer =
                document.getElementById("errorContainer");

            const errorList =
                document.getElementById("errorList");

            const item = document.createElement("li");

            item.textContent = message;

            errorList.appendChild(item);

            errorContainer.hidden = false;
        }

        function clearErrors() {

            document.getElementById("errorList").innerHTML = "";

            document.getElementById("errorContainer").hidden = true;
        }

    </script>

</body>

</html>
